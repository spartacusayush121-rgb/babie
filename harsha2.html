<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Want to Kiss Me?</title>
<style>
  body, html {
    height: 100%;
    margin: 0;
    font-family: 'Comic Sans MS', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffffff, #c79aff);
    overflow: hidden;
    position: relative;
  }

  .container {
    text-align: center;
    background: rgba(255, 255, 255, 0.8);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
    position: relative;
  }

  h1 {
    font-size: 2.5em;
    color: #8a2be2;
    margin-bottom: 30px;
    position: relative;
  }

  /* Heart floating background */
  .heart {
    position: absolute;
    font-size: 24px;
    color: pink;
    animation: float 6s linear infinite;
    pointer-events: none;
  }

  @keyframes float {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0;}
    50% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0;}
  }

  button {
    padding: 15px 40px;
    font-size: 1.2em;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 10px;
    transition: transform 0.2s;
    position: relative;
  }

  #yes {
    background-color: #ff69b4;
    color: white;
  }

  #no {
    background-color: #8a2be2;
    color: white;
    position: absolute;
  }

  #message {
    font-size: 1.5em;
    color: #ff1493;
    margin-top: 20px;
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Do you want to kiss me?</h1>
  <button id="yes">Yes</button>
  <button id="no">No</button>
  <div id="message">HAWASI KAHI KI !! SARAM NAHI AARA HAI !!❤️</div>
</div>

<script>
  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');
  const message = document.getElementById('message');
  const container = document.querySelector('.container');

  // Random position for No button
  function moveNoButton() {
    const containerRect = container.getBoundingClientRect();
    const x = Math.random() * (containerRect.width - noBtn.offsetWidth);
    const y = Math.random() * (containerRect.height - noBtn.offsetHeight);
    noBtn.style.left = `${x}px`;
    noBtn.style.top = `${y}px`;
  }

  noBtn.addEventListener('mouseenter', moveNoButton);

  yesBtn.addEventListener('click', () => {
    message.style.display = 'block';
    yesBtn.style.display = 'none';
    noBtn.style.display = 'none';
  });

  // Create floating hearts dynamically
  function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerText = '💖';
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
    heart.style.animationDuration = (Math.random() * 5 + 3) + 's';
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 8000);
  }

  setInterval(createHeart, 500);

</script>

</body>
</html>
